app = "away-vacation-nate"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ORIGIN = "https://away-vacation-nate.fly.dev"
  COOKIE_SECURE = "true"
  LANGGRAPH_API_URL = "https://vacation-agent-a9855629615a52f0ae427812f8a13c65.us.langgraph.app"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpus = 1
  cpu_kind = "shared"
