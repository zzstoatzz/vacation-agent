[project]
name = "vacation-agent"
version = "0.1.0"
description = "A LangChain vacation planner deployed on LangSmith"
requires-python = ">=3.11"
dependencies = ["langchain[openai]>=1.0,<2", "langgraph>=1.0,<2"]

[dependency-groups]
dev = ["langgraph-cli[inmem]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacation_agent"]
